name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: make install
      - run: make doctor
      - run: make test
      - run: PYTHONPATH=.:tools/offline .venv/bin/python -m unittest tools.tests.test_guest_preview
      - run: cd app && VITE_ATELIER_GUEST_PREFIX=/apps/peru npm run build -- --base=/apps/peru/
      - run: make build
      - run: make android
