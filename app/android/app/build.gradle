apply plugin: 'com.android.application'

def signingPath = providers.gradleProperty('rocotoSigningProperties')
    .orElse(providers.environmentVariable('ROCOTO_ANDROID_SIGNING_PROPERTIES'))
    .orElse("${System.getProperty('user.home')}/.rocoto-keys/keystore.properties").get()
def signingFile = file(signingPath)
def uploadProperties = new Properties()
if (signingFile.isFile()) signingFile.withInputStream { uploadProperties.load(it) }
def signingReady = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].every {
    uploadProperties.getProperty(it)?.trim()
} && file(uploadProperties.getProperty('storeFile', '/missing')).isFile()

android {
    namespace = "com.soyrocoto.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "org.example.shopworkspace"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 9
        versionName "0.6.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (signingReady) {
            upload {
                storeFile file(uploadProperties.getProperty('storeFile'))
                storePassword uploadProperties.getProperty('storePassword')
                keyAlias uploadProperties.getProperty('keyAlias')
                keyPassword uploadProperties.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            if (signingReady) signingConfig signingConfigs.upload
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

tasks.register('validateReleaseSigning') {
    doLast {
        if (!signingReady) throw new GradleException('Rocoto release signing requires the private upload keystore configuration.')
    }
}
tasks.configureEach {
    if (name == 'preReleaseBuild') dependsOn tasks.named('validateReleaseSigning')
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.browser:browser:1.9.0'
    implementation 'com.whatsapp.otp:whatsapp-otp-android-sdk:1.0.0'
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
